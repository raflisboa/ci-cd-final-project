name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 nose
        # Se você tiver um requirements.txt: pip install -r requirements.txt

    # TAREFA 2: Snippet de Linting
    - name: Run Linting (Flake8)
      run: |
        # Para a execução se houver erros de sintaxe ou variáveis indefinidas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # A complexidade máxima é 10
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # TAREFA 3: Snippet de Teste
    - name: Run Tests (Nose)
      run: |
        nosetests --with-coverage --cover-package=app